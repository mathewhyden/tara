reater clarity, confidence and wellbeing.`},oe=(e,t)=>{window.location.href=`mailto:`+D.email+`?subject=`+encodeURIComponent(e)+`&body=`+encodeURIComponent(t)},se=[{id:`trauma-recovery`,title:`Trauma Recovery`,shortDescription:`A gentle, trauma-informed space to make sense of difficult experiences at a pace that feels safe.`,fullDescription:`Dr Anne brings trauma-informed psychology together with positive psychology principles to support recovery. No particular outcome can be guaranteed, and support is tailored to you.`,iconName:`ShieldCheck`,benefits:[`Trauma-informed approach`,`A safe, unhurried pace`,`Building steadiness and self-trust`],duration:`Details on enquiry`},{id:`narcissistic-abuse`,title:`Narcissistic Abuse Recovery`,shortDescription:`Support in rebuilding self-trust, clarity and healthy boundaries after emotionally harmful relationships.`,fullDescription:`Recovery from narcissistic abuse is listed among Dr Anne’s areas of specialization. Sessions focus on understanding what happened and rebuilding your sense of self.`,iconName:`HeartHandshake`,benefits:[`Rebuilding self-trust`,`Clarity and healthy boundaries`,`Non-judgmental support`],duration:`Details on enquiry`},{id:`inner-child-resilience`,title:`Emotional Resilience & Inner-Child Work`,shortDescription:`Understanding early patterns and building healthier inner foundations to meet life with steadiness.`,fullDescription:`Dr Anne helps people heal emotional wounds, rebuild resilience and cultivate healthy inner foundations.`,iconName:`Compass`,benefits:[`Understanding emotional patterns`,`Building resilience`,`Healthier inner foundations`],duration:`Details on enquiry`},{id:`positive-psychology-coaching`,title:`Positive Psychology Coaching`,shortDescription:`Strengths-based, goal-oriented coaching toward a more intentional life. Coaching is distinct from psychotherapy.`,fullDescription:`Dr Anne is an ICF-ACC certified Positive Psychology Coach with training in strengths-based practice.`,iconName:`Sparkles`,benefits:[`Strengths-based growth`,`Clarity and direction`,`Intentional living`],duration:`Details on enquiry`},{id:`mindfulness-ei`,title:`Mindfulness & Emotional Intelligence`,shortDescription:`Practices for noticing feelings, pausing before reacting and relating more wisely to yourself and others.`,fullDescription:`Mindfulness and emotional intelligence are among Dr Anne’s listed areas, and she is also a trained meditation teacher.`,iconName:`Activity`,benefits:[`Awareness of feelings`,`Pausing before reacting`,`Relating with more understanding`],duration:`Details on enquiry`},{id:`grief-healing`,title:`Grief Healing`,shortDescription:`Company and care while you move through loss in your own way and time.`,fullDescription:`Grief healing and strengths-based growth are among Dr Anne’s listed areas of specialization.`,iconName:`Users`,benefits:[`Space for loss`,`No fixed timeline`,`Gentle, steady support`],duration:`Details on enquiry`}],ce=[{id:`understanding-your-emotions`,slug:`understanding-your-emotions`,title:`Understanding Your Emotions: A Compassionate Guide to Feeling and Healing`,category:`Emotional Wellbeing`,author:`Dr Anne Rosario`,authorRole:`Draft pending Dr Anne’s approval`,date:`Educational draft`,readTime:`5 min read`,imageUrl:E.panels[0],tags:[`Emotions`,`Mindfulness`,`Self-Awareness`,`Counselling`],excerpt:`Emotions are not obstacles to overcome or irrational impulses to suppress; they are vital indicators of our values, boundaries, and unmet psychological needs.`,content:[`In a society that frequently prioritizes perpetual cheerfulness and relentless productivity, we are often subtly conditioned to treat unpleasant emotions as personal failures. Sadness is rushed into forced cheerfulness; anxiety is met with self-criticism; anger is suppressed until it erupts unexpectedly.`,`In counselling psychology, we understand that all human emotions serve an evolutionary and protective function. Anxiety alerts us to potential vulnerability. Sadness invites introspection and processing after a loss or disappointment. Anger marks where our boundaries have been breached or an injustice has occurred.`,`When we begin to treat our emotional states with curiosity rather than condemnation, something profound shifts. Instead of asking "Why am I feeling so weak?", we begin asking "What is this feeling attempting to communicate to me right now?"`,`At Tara Mindcare, one of our fundamental practices is emotional attunement: learning to pause, identify somatic sensations in the body, name the emotion accurately, and respond with compassionate self-care rather than avoidance.`],keyTakeaways:[`Emotions are messengers that communicate internal states and boundary needs.`,`Suppression creates somatic tension, sleep disruption, and delayed emotional outbursts.`,`Naming the emotion precisely reduces amygdala reactivity and fosters regulation.`,`Self-compassion is the foundation upon which emotional resilience is built.`]},{id:`building-self-confidence`,slug:`building-self-confidence`,title:`Building Self-Confidence: Unlearning Self-Doubt and Owning Your Worth`,category:`Personal Growth`,author:`Dr Anne Rosario`,authorRole:`Draft pending Dr Anne’s approval`,date:`Educational draft`,readTime:`6 min read`,imageUrl:E.panels[1],tags:[`Confidence`,`Self-Esteem`,`Imposter Syndrome`,`Personal Growth`],excerpt:`True confidence is not the absence of fear or uncertainty, but the grounded knowledge that you have the internal resources to face life as it unfolds.`,content:[`Many clients walk into therapy believing that confident people never experience self-doubt or anxiety. In reality, genuine self-confidence is rarely about loud bravado. Rather, it is a quiet, steady self-trust that survives mistakes, criticism, and setbacks.`,`Persistent low self-esteem is usually rooted in early messages we internalized about our worth, performance, and acceptance. When praise was conditional on perfection, or when vulnerability was met with dismissal, our internal dialogue becomes punitive.`,`Rebuilding self-confidence involves a systematic process of identifying automatic negative thoughts, distinguishing between factual limitations and harsh self-judgments, and taking small, courage-based actions in everyday life.`,`Remember: confidence follows action; it does not precede it. As you practice honoring your boundaries and making choices aligned with your values, self-trust naturally solidifies.`],keyTakeaways:[`Confidence is built through gradual exposure and self-trust, not forced positive thinking.`,`Imposter syndrome thrives in silence; discussing it dissipates its hold.`,`Boundary setting is one of the highest expressions of self-worth.`,`Celebrate progress over perfection in every domain of personal growth.`]},{id:`navigating-relationships`,slug:`navigating-relationships`,title:`Navigating Relationships: Healthy Boundaries and Meaningful Connection`,category:`Relationships`,author:`Dr Anne Rosario`,authorRole:`Draft pending Dr Anne’s approval`,date:`Educational draft`,readTime:`7 min read`,imageUrl:E.panels[2],tags:[`Relationships`,`Boundaries`,`Communication`,`Attachment`],excerpt:`Boundaries are not walls designed to keep others out; they are clear gates that clarify where you end and another person begins, making authentic intimacy possible.`,content:[`The quality of our personal relationships fundamentally shapes our emotional and physical wellbeing. Yet so few of us were ever taught the psychological architecture of healthy communication and boundary management.`,`In many relationships, conflict becomes repetitive because partners react to attachment distress rather than the actual topic on the table. A dispute over household chores is rarely about dishes—it is usually about feeling seen, valued, and respected.`,`When we learn to communicate from a vulnerable, non-accusatory place ("When this happened, I felt disconnected and overwhelmed" rather than "You never care"), defensive walls drop and genuine repair becomes possible.`,`Counselling offers a neutral, compassionate ground to examine these communication loops, unpack attachment styles, and cultivate relational habits that foster long-term love and mutual respect.`],keyTakeaways:[`Clear boundaries are essential prerequisites for deep, safe intimacy.`,`Most chronic relationship arguments stem from unmet emotional connection needs.`,`Listening to understand is vastly more effective than listening to defend.`,`Repairing after a conflict is more critical than never having conflict at all.`]},{id:`managing-everyday-stress`,slug:`managing-everyday-stress`,title:`Managing Everyday Stress: Practical Strategies for a Calmer Life`,category:`Stress Management`,author:`Dr Anne Rosario`,authorRole:`Draft pending Dr Anne’s approval`,date:`Educational draft`,readTime:`4 min read`,imageUrl:E.panels[3],tags:[`Stress`,`Wellbeing`,`Mindfulness`,`Calm`],excerpt:`Chronic micro-stresses accumulate silently over weeks and months. Learn practical psychological interventions to down-regulate your nervous system.`,content:[`Modern life bombards our nervous systems with constant notifications, deadlines, and social obligations. While acute stress is a natural survival mechanism, constant low-grade stress exhausts both mind and body.`,`Stress management is not a luxury or an occasional weekend spa treatment; it is a foundational daily mental hygiene practice. Small micro-practices—like deliberate physiological sighs, brief nature breaks, and digital sunsets—send safety signals to the nervous system.`,`In therapy, we examine where your energy is being drained and build realistic boundaries around time, expectations, and commitments so that your days feel sustainable rather than overwhelming.`],keyTakeaways:[`The nervous system requires deliberate cues of safety to down-regulate.`,`Micro-breaks throughout the day prevent cumulative evening burnout.`,`Prioritize restorative rest that does not involve screen stimulation.`,`Professional guidance helps identify non-obvious cognitive stress multipliers.`]},{id:`understanding-personal-patterns`,slug:`understanding-personal-patterns`,title:`Understanding Personal Patterns: Breaking Free From Repetitive Cycles`,category:`Self-Understanding`,author:`Dr Anne Rosario`,authorRole:`Draft pending Dr Anne’s approval`,date:`Educational draft`,readTime:`5 min read`,imageUrl:E.panels[4],tags:[`Patterns`,`Psychology`,`Healing`,`Growth`],excerpt:`Why do we often find ourselves reacting in the exact same way to different situations? Uncovering unconscious scripts is the first step toward lasting freedom.`,content:[`Have you ever noticed yourself repeatedly taking on too much responsibility, avoiding confrontation until you explode, or pulling away whenever someone gets close? These are not character flaws—they are learned behavioral patterns.`,`Patterns often develop early in life as adaptive strategies to maintain safety, connection, or approval. However, what protected you in childhood may constrain you in adulthood.`,`By mapping out your automatic triggers, emotional interpretations, and resultant actions in counselling, you gain the power of the conscious pause: the sacred moment between stimulus and response where choice resides.`],keyTakeaways:[`Repetitive behaviors were once adaptive solutions to earlier environments.`,`Awareness without judgment is the prerequisite for behavioral change.`,`The pause between trigger and reaction is where your personal power lives.`,`Therapy provides the supportive scaffolding to test out new, healthier responses.`]}],le=[{question:`How do I know if counselling is right for me?`,answer:`Counselling is beneficial whenever you feel overwhelmed, stuck in repetitive patterns, navigating a difficult transition, or simply seeking deeper self-understanding and emotional clarity. You do not need to be in acute crisis to benefit from professional psychological guidance.`},{question:`What can I expect in our first session?`,answer:`Our first session is an unhurried, warm conversation where you can share what has brought you to Tara Mindcare. Dr Anne Rosario will listen attentively, understand your background and present goals, and outline how you can work collaboratively together in a completely non-judgmental environment.`},{question:`Are sessions confidential?`,answer:`Yes, absolutely. Strict confidentiality is an inviolable ethical cornerstone of professional counselling psychology. Everything discussed in your sessions remains strictly private and protected under ethical guidelines.`},{question:`How are online consultations conducted?`,answer:`Online sessions are conducted through secure, high-quality video conferencing. This provides clients with the convenience and comfort of attending sessions from their own private space, whether in India or internationally.`},{question:`How many sessions will I need?`,answer:`The duration of counselling varies based on your individual needs and goals. Some clients find clarity and actionable tools in a few sessions, while others choose ongoing support for deeper personal transformation. We will review your progress together regularly.`}],ue=e=>e.replace(/([a-z0-9])([A-Z])/g,`$1-$2`).toLowerCase(),de=e=>e.replace(/^([A-Z])|[\s-_]+(\w)/g,(e,t,n)=>n?n.toUpperCase():t.toLowerCase()),fe=e=>{let t=de(e);return t.charAt(0).toUpperCase()+t.slice(1)},pe=(...e)=>e.filter((e,t,n)=>!!e&&e.trim()!==``&&n.indexOf(e)===t).join(` `).trim(),me=e=>{for(let t in e)if(t.startsWith(`aria-`)||t===`role`||t===`title`)return!0},he={xmlns:`http://www.w3.org/2000/svg`,width:24,height:24,viewBox:`0 0 24 24`,fill:`none`,stroke:`currentColor`,strokeWidth:2,strokeLinecap:`round`,strokeLinejoin:`round`},ge=(0,b.forwardRef)(({color:e=`currentColor`,size:t=24,strokeWidth:n=2,absoluteStrokeWidth:r,className:i=``,children:a,iconNode:o,...s},c)=>(0,b.createElement)(`svg`,{ref:c,...he,width:t,height:t,stroke:e,strokeWidth:r?Number(n)*24/Number(t):n,className:pe(`lucide`,i),...!a&&!me(s)&&{"aria-hi
